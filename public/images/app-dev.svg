<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <defs>
    <linearGradient id="adGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="adGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Floating Smartphone Model -->
  <g transform="translate(160, 20)">
    <!-- Phone Outer Case -->
    <rect width="180" height="310" rx="30" fill="#0b1120" stroke="rgba(56, 189, 248, 0.4)" stroke-width="3"/>
    <!-- Phone Screen -->
    <rect x="8" y="8" width="164" height="294" rx="24" fill="#040711"/>
    <!-- Dynamic Island / Notch -->
    <rect x="62" y="14" width="56" height="12" rx="6" fill="#1e293b"/>

    <!-- App Header -->
    <rect x="22" y="38" width="80" height="8" rx="4" fill="#38bdf8"/>
    <circle cx="145" cy="42" r="10" fill="#1e293b"/>

    <!-- App Card 1: Balance / Biometrics -->
    <rect x="20" y="60" width="140" height="75" rx="14" fill="url(#adGrad2)"/>
    <text x="32" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="rgba(255,255,255,0.8)">Active Portfolio</text>
    <text x="32" y="105" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="18" fill="#ffffff">$48,250.00</text>
    <text x="32" y="123" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#86efac">+18.4% this month</text>

    <!-- App Quick Action Badges -->
    <circle cx="45" cy="160" r="15" fill="#1e293b"/>
    <circle cx="90" cy="160" r="15" fill="#1e293b"/>
    <circle cx="135" cy="160" r="15" fill="#1e293b"/>

    <!-- Chart in app -->
    <rect x="20" y="190" width="140" height="60" rx="10" fill="#0e172a" stroke="rgba(255,255,255,0.06)"/>
    <path d="M30 230 Q 55 205, 80 220 T 120 200 T 150 210" fill="none" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- Bottom Navigation Bar -->
    <rect x="35" y="270" width="110" height="18" rx="9" fill="#111c35"/>
  </g>

  <!-- Side Floating Tech Badges -->
  <g transform="translate(40, 110)">
    <rect width="100" height="42" rx="10" fill="#0b1324" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
    <text x="18" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#38bdf8">iOS Native</text>
  </g>

  <g transform="translate(40, 175)">
    <rect width="100" height="42" rx="10" fill="#0b1324" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>
    <text x="18" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#10b981">Android</text>
  </g>

  <g transform="translate(365, 140)">
    <rect width="100" height="42" rx="10" fill="#0b1324" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.5"/>
    <text x="16" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#a855f7">Flutter / RN</text>
  </g>
</svg>
