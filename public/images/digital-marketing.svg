  <text x="77" y="140" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#38bdf8">1.8M / mo</text>

  <rect x="195" y="95" width="110" height="60" rx="10" fill="#070c18" stroke="rgba(255,255,255,0.06)"/>
