  <rect x="325" y="95" width="110" height="60" rx="10" fill="#070c18" stroke="rgba(255,255,255,0.06)"/>
  <text x="337" y="115" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#94a3b8">Customer CAC</text>
  <text x="337" y="140" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#a855f7">-42% Drop</text>

  <!-- Trajectory Chart Area -->
  <rect x="65" y="170" width="370" height="130" rx="12" fill="#070d1a" stroke="rgba(255,255,255,0.04)"/>
  <path d="M85 270 Q 140 250, 190 220 T 290 195 T 390 185" fill="none" stroke="url(#dmGrad)" stroke-width="3.5"/>
  <circle cx="390" cy="185" r="6" fill="#34d399"/>
  <circle cx="290" cy="195" r="4" fill="#06b6d4"/>
  <circle cx="190" cy="220" r="4" fill="#3b82f6"/>
