<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <defs>
    <linearGradient id="dmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Main Growth Analytics Screen -->
  <rect x="40" y="30" width="420" height="290" rx="18" fill="#0b1324" stroke="rgba(16, 185, 129, 0.3)" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="40" y="30" width="420" height="50" rx="18" fill="#101930"/>
  <circle cx="70" cy="55" r="10" fill="#10b981"/>
  <text x="92" y="59" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#ffffff">Growth &amp; ROI Performance Engine</text>
  <rect x="345" y="44" width="95" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)"/>
  <text x="360" y="60" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#34d399">+340% ROI</text>

  <!-- Metric KPI Cards -->
  <rect x="65" y="95" width="110" height="60" rx="10" fill="#070c18" stroke="rgba(255,255,255,0.06)"/>
