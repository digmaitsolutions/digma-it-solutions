  <text x="350" y="190" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="22" fill="#f472b6">99.4% Acc</text>

  <rect x="330" y="230" width="200" height="85" rx="10" fill="#25143a" stroke="rgba(255,255,255,0.06)"/>
  <text x="350" y="260" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#c084fc">Cost Reduction</text>
  <text x="350" y="290" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="22" fill="#34d399">-$1.4M / yr</text>
</svg>
