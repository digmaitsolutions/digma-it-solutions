<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="#11091a"/>
  <rect x="40" y="40" width="520" height="320" rx="14" fill="#190e26" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1.5"/>
  <rect x="70" y="70" width="220" height="12" rx="6" fill="#c084fc"/>
  <rect x="70" y="92" width="130" height="8" rx="4" fill="#64748b"/>

  <!-- Neural Network Cluster -->
  <g transform="translate(140, 190)">
    <circle cx="-50" cy="-40" r="14" fill="#7c3aed"/>
    <circle cx="-50" cy="40" r="14" fill="#7c3aed"/>
    <circle cx="30" cy="-60" r="12" fill="#a855f7"/>
    <circle cx="30" cy="0" r="16" fill="url(#aiGrad)"/>
    <circle cx="30" cy="60" r="12" fill="#a855f7"/>
    <circle cx="110" cy="-30" r="14" fill="#c084fc"/>
    <circle cx="110" cy="30" r="14" fill="#c084fc"/>

    <path d="M-50 -40 L30 -60 M-50 -40 L30 0 M-50 40 L30 0 M-50 40 L30 60" stroke="#9333ea" stroke-width="2" opacity="0.6"/>
    <path d="M30 -60 L110 -30 M30 0 L110 -30 M30 0 L110 30 M30 60 L110 30" stroke="#c084fc" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Side Metrics -->
