<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <defs>
    <linearGradient id="wdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Browser Container -->
  <rect x="30" y="30" width="440" height="290" rx="16" fill="#0b1324" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/>
  
  <!-- Browser Window Header -->
  <rect x="30" y="30" width="440" height="42" rx="16" fill="#111c35"/>
  <circle cx="56" cy="51" r="5" fill="#ef4444"/>
  <circle cx="74" cy="51" r="5" fill="#f59e0b"/>
  <circle cx="92" cy="51" r="5" fill="#10b981"/>
  <rect x="130" y="42" width="240" height="18" rx="9" fill="#080d1a"/>
  <text x="180" y="55" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#64748b">https://digma.tech/enterprise</text>

  <!-- Code / Architecture Grid Inside -->
  <rect x="55" y="95" width="220" height="130" rx="10" fill="#070c18" stroke="rgba(255,255,255,0.06)"/>
  <text x="75" y="125" font-family="'Courier New', monospace" font-size="11" fill="#38bdf8">&lt;<tspan fill="#a855f7">NextApp</tspan> ssr={true}&gt;</text>
  <text x="90" y="145" font-family="'Courier New', monospace" font-size="11" fill="#94a3b8">&lt;<tspan fill="#06b6d4">ModernCloudAPI</tspan> /&gt;</text>
  <text x="90" y="165" font-family="'Courier New', monospace" font-size="11" fill="#10b981">&lt;<tspan fill="#f59e0b">HighSpeedCache</tspan> /&gt;</text>
  <text x="75" y="185" font-family="'Courier New', monospace" font-size="11" fill="#38bdf8">&lt;/<tspan fill="#a855f7">NextApp</tspan>&gt;</text>

  <!-- Side UI Performance Widget -->
  <rect x="295" y="95" width="150" height="130" rx="10" fill="#0e172a" stroke="rgba(56, 189, 248, 0.2)"/>
  <circle cx="370" cy="150" r="34" stroke="#1e293b" stroke-width="7" fill="none"/>
  <circle cx="370" cy="150" r="34" stroke="#10b981" stroke-width="7" stroke-dasharray="190 220" fill="none"/>
  <text x="357" y="156" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#ffffff">99</text>
  <text x="330" y="205" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#94a3b8">Lighthouse Core</text>

  <!-- Bottom Metric Bar -->
  <rect x="55" y="245" width="390" height="50" rx="10" fill="#0d172e" stroke="rgba(255,255,255,0.06)"/>
  <circle cx="85" cy="270" r="12" fill="url(#wdGrad)"/>
  <text x="110" y="274" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#ffffff">Scalable Web Architecture &amp; Headless Stack</text>
</svg>
