<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" fill="none">
  <defs>
    <!-- Metallic Blue Gradients matching the DigMa brand -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <linearGradient id="cursorGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glowing click aura around the i dot pointer -->
    <filter id="pointerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Bevel shadow effect -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- ==================== LEFT EMBLEM: CLOUD + INTERLOCKING D & M ==================== -->
  <g transform="translate(15, 15)" filter="url(#dropShadow)">
    
    <!-- Cloud Outer Contour Path with Interconnected Knots -->
    <!-- Cloud Upper Arcs -->
    <path d="M 85 45 
             C 65 25, 30 35, 25 65
             C 10 70, 5 95, 18 115
             C 8 135, 30 150, 55 145
             L 135 145
             C 165 148, 185 130, 175 105
             C 185 85, 170 60, 145 60
             C 140 30, 105 25, 85 45 Z" 
          stroke="url(#cloudGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Intertwined Geometric Celtic Knot D & M Structure Inside Cloud -->
    <!-- Left 'D' Loop -->
    <path d="M 45 65 L 45 130 L 75 130 C 95 130, 95 65, 75 65 Z" 
          stroke="url(#cloudGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Center Interlaced 'M' Ribbons -->
    <path d="M 65 130 L 65 75 L 105 125 L 145 75 L 145 130" 
          stroke="url(#cloudGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Cross Knot Ribbons weaving through the D and M -->
    <path d="M 45 98 L 145 98" 
          stroke="url(#cloudGrad)" stroke-width="6.5" stroke-linecap="round" fill="none" opacity="0.9" />

    <path d="M 75 65 L 135 130" 
          stroke="url(#cloudGrad)" stroke-width="6" stroke-linecap="round" fill="none" />

    <!-- Cloud Central Arch Highlight -->
    <path d="M 70 52 C 85 36, 115 36, 130 54" 
          stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>

  <!-- ==================== RIGHT WORDMARK: DigMa IT Solutions ==================== -->
  <g transform="translate(210, 25)">
    
    <!-- Top Wordmark: DigMa -->
    <!-- D -->
    <text x="0" y="78" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="74" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">
      D
    </text>

    <!-- Lowercase i (stem only, dot replaced by custom glowing cursor) -->
    <path d="M 62 38 L 62 77" stroke="url(#textGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- Glowing Cursor Arrow replacing the dot on 'i' -->
    <g transform="translate(62, 16)" filter="url(#pointerGlow)">
      <!-- Radiant Light Rays around Cursor Pointer -->
      <line x1="0" y1="-14" x2="0" y2="-9" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
      <line x1="-12" y1="-9" x2="-8" y2="-6" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
      <line x1="12" y1="-9" x2="8" y2="-6" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
      <line x1="-14" y1="2" x2="-9" y2="2" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
      <line x1="14" y1="2" x2="9" y2="2" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
      
      <!-- Cyan Glow Burst Center -->
      <circle cx="0" cy="0" r="10" fill="#0284c7" opacity="0.4" filter="blur(3px)" />

      <!-- Cursor Arrow Pointer Icon -->
      <path d="M 0 -9 L 7 6 L 1 4 L 0 9 L -1 4 L -7 6 Z" fill="url(#cursorGrad)" stroke="#e0f2fe" stroke-width="1" />
    </g>

    <!-- gMa -->
    <text x="76" y="78" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="74" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">
      g<tspan font-weight="800">M</tspan>a
    </text>

    <!-- Subtitle: IT Solutions -->
    <text x="2" y="118" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="600" fill="#38bdf8" letter-spacing="1">
      IT Solutions
    </text>
  </g>
</svg>
